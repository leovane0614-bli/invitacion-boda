<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>❤️ Leo & Vane ❤️ Nuestra Boda</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #fdfbf7;
            color: #333;
        }

        .contenedor {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .saludo {
            font-size: 1.5rem;
            color: #b8860b;
            margin-bottom: 10px;
        }

        .nombre-invitado {
            font-size: 2rem;
            font-weight: bold;
            color: #4a4a4a;
            margin-top: 0;
        }
    </style>

</head>


<body>

    <div class="contenedor">

        <p class="saludo">¡Especialmente invitado/a!</p>

        <!-- Elemento donde se mostrará el nombre del invitado -->
        <h1
            id="nombre-invitado"
            class="nombre-invitado"
        >
            Invitado Especial
        </h1>

        <p>
            Con inmensa alegría y agradecimiento a Dios, queremos compartir con
            ustedes uno de los momentos más importantes de nuestras vidas.
        </p>

    </div>


    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Obtener el fragmento (#Nombre) de la URL
            const hash = window.location.hash.substring(1);

            if (hash) {
                // Decodificar caracteres especiales (%20 -> espacio, etc.)
                const nombreDecodificado = decodeURIComponent(hash);

                // Insertar el nombre en el elemento HTML
                const elementoNombre = document.getElementById("nombre-invitado");
                if (elementoNombre) {
                    elementoNombre.textContent = nombreDecodificado;
                }
            }
        });
    </script>

</body>

</html>
